services:
  caddy:
    image: caddy:2.9-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin Certificate, kept outside the repo checkout so a
      # `git pull` during deploy cannot clobber or expose it.
      - /opt/vocalonix/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-network

  vocalonix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${HARKBELL_POSTGRES_USER:-vocalonix}"
      POSTGRES_PASSWORD: "${HARKBELL_POSTGRES_PASSWORD:-vocalonix}"
      POSTGRES_DB: "${HARKBELL_POSTGRES_DB:-vocalonix}"
    volumes:
      - vocalonix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HARKBELL_POSTGRES_USER:-vocalonix} -d ${HARKBELL_POSTGRES_DB:-vocalonix}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  harkbell-api:
    build:
      context: ../../..
      dockerfile: app/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: "${NODE_ENV:-development}"
      DATABASE_URL: "postgres://${HARKBELL_POSTGRES_USER:-vocalonix}:${HARKBELL_POSTGRES_PASSWORD:-vocalonix}@vocalonix-db:5432/${HARKBELL_POSTGRES_DB:-vocalonix}"
      APP_ORIGIN: "${APP_ORIGIN}"
      API_PUBLIC_URL: "${API_PUBLIC_URL}"
      AUTH_SECRET: "${AUTH_SECRET}"
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-false}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM}"
      MAGIC_LINK_TTL_SECONDS: "${MAGIC_LINK_TTL_SECONDS:-300}"
      DOGRAH_INTERNAL_URL: "${DOGRAH_INTERNAL_URL}"
      DOGRAH_PUBLIC_API_URL: "${DOGRAH_PUBLIC_API_URL}"
      DOGRAH_WIDGET_URL: "${DOGRAH_WIDGET_URL}"
      DOGRAH_STORAGE_INTERNAL_URL: "${DOGRAH_STORAGE_INTERNAL_URL}"
      DOGRAH_API_KEY: "${DOGRAH_API_KEY:-}"
      DOGRAH_SERVICE_EMAIL: "${DOGRAH_SERVICE_EMAIL}"
      DOGRAH_SERVICE_PASSWORD: "${DOGRAH_SERVICE_PASSWORD}"
      DOGRAH_SERVICE_NAME: "${DOGRAH_SERVICE_NAME}"
      DOGRAH_WORKFLOW_NAME: "${DOGRAH_WORKFLOW_NAME}"
      DOGRAH_WIDGET_ALLOWED_DOMAINS: "${DOGRAH_WIDGET_ALLOWED_DOMAINS}"
      # Must stay reachable from the *Dograh box*, which is a separate
      # host: this URL is baked into the agent tools registered with the
      # engine, and the engine is what calls it mid-conversation. A compose
      # service name resolves only inside this box's network, so it is left
      # empty here and falls back to API_PUBLIC_URL. Only pin it when the
      # engine shares a Docker network with the API.
      HARKBELL_INTERNAL_URL: "${HARKBELL_INTERNAL_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_EXTRACTION_MODEL: "${GEMINI_EXTRACTION_MODEL:-gemini-flash-latest}"
      VOICE_STACK: "${VOICE_STACK:-auto}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      ELEVENLABS_VOICE_ID: "${ELEVENLABS_VOICE_ID:-}"
      CARTESIA_API_KEY: "${CARTESIA_API_KEY:-}"
      CARTESIA_VOICE_ID: "${CARTESIA_VOICE_ID:-}"
      VOICE_LLM_MODEL: "${VOICE_LLM_MODEL:-gpt-4.1-mini}"
      VOICE_STT_MODEL: "${VOICE_STT_MODEL:-nova-3-general}"
      VOICE_LANGUAGE: "${VOICE_LANGUAGE:-multi}"
      VOICE_REALTIME_MODEL: "${VOICE_REALTIME_MODEL:-gemini-3.1-flash-live-preview}"
      TELNYX_API_KEY: "${TELNYX_API_KEY:-}"
      TELNYX_CONNECTION_ID: "${TELNYX_CONNECTION_ID:-}"
      TELNYX_WEBHOOK_PUBLIC_KEY: "${TELNYX_WEBHOOK_PUBLIC_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      # Price ids are public identifiers, not secrets — they appear in any
      # client-side Stripe integration — so they carry real defaults. Without
      # them a plan is not offered for purchase at all, and this file passed
      # neither, so the pricing page could only ever say "Talk to us".
      STRIPE_PRICE_STARTER: "${STRIPE_PRICE_STARTER:-price_1U5Jm8L127qQV0Os9cRk0OqF}"
      STRIPE_PRICE_PRO: "${STRIPE_PRICE_PRO:-price_1U5JmBL127qQV0OsmJMGgDbl}"
      MAX_OWNED_WORKSPACES: "${MAX_OWNED_WORKSPACES:-50}"
    depends_on:
      vocalonix-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3001/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  vocalonix-worker:
    build:
      context: ../../..
      dockerfile: app/api/Dockerfile
    restart: unless-stopped
    command: ["bun", "src/worker.ts"]
    environment:
      PORT: "3001"
      NODE_ENV: "${NODE_ENV:-development}"
      DATABASE_URL: "postgres://${HARKBELL_POSTGRES_USER:-vocalonix}:${HARKBELL_POSTGRES_PASSWORD:-vocalonix}@vocalonix-db:5432/${HARKBELL_POSTGRES_DB:-vocalonix}"
      APP_ORIGIN: "${APP_ORIGIN}"
      API_PUBLIC_URL: "${API_PUBLIC_URL}"
      AUTH_SECRET: "${AUTH_SECRET}"
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-false}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM}"
      MAGIC_LINK_TTL_SECONDS: "${MAGIC_LINK_TTL_SECONDS:-300}"
      DOGRAH_INTERNAL_URL: "${DOGRAH_INTERNAL_URL}"
      DOGRAH_PUBLIC_API_URL: "${DOGRAH_PUBLIC_API_URL}"
      DOGRAH_WIDGET_URL: "${DOGRAH_WIDGET_URL}"
      DOGRAH_STORAGE_INTERNAL_URL: "${DOGRAH_STORAGE_INTERNAL_URL}"
      DOGRAH_API_KEY: "${DOGRAH_API_KEY:-}"
      DOGRAH_SERVICE_EMAIL: "${DOGRAH_SERVICE_EMAIL}"
      DOGRAH_SERVICE_PASSWORD: "${DOGRAH_SERVICE_PASSWORD}"
      DOGRAH_SERVICE_NAME: "${DOGRAH_SERVICE_NAME}"
      DOGRAH_WORKFLOW_NAME: "${DOGRAH_WORKFLOW_NAME}"
      DOGRAH_WIDGET_ALLOWED_DOMAINS: "${DOGRAH_WIDGET_ALLOWED_DOMAINS}"
      # Must stay reachable from the *Dograh box*, which is a separate
      # host: this URL is baked into the agent tools registered with the
      # engine, and the engine is what calls it mid-conversation. A compose
      # service name resolves only inside this box's network, so it is left
      # empty here and falls back to API_PUBLIC_URL. Only pin it when the
      # engine shares a Docker network with the API.
      HARKBELL_INTERNAL_URL: "${HARKBELL_INTERNAL_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_EXTRACTION_MODEL: "${GEMINI_EXTRACTION_MODEL:-gemini-flash-latest}"
      VOICE_STACK: "${VOICE_STACK:-auto}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      ELEVENLABS_VOICE_ID: "${ELEVENLABS_VOICE_ID:-}"
      CARTESIA_API_KEY: "${CARTESIA_API_KEY:-}"
      CARTESIA_VOICE_ID: "${CARTESIA_VOICE_ID:-}"
      VOICE_LLM_MODEL: "${VOICE_LLM_MODEL:-gpt-4.1-mini}"
      VOICE_STT_MODEL: "${VOICE_STT_MODEL:-nova-3-general}"
      VOICE_LANGUAGE: "${VOICE_LANGUAGE:-multi}"
      VOICE_REALTIME_MODEL: "${VOICE_REALTIME_MODEL:-gemini-3.1-flash-live-preview}"
      TELNYX_API_KEY: "${TELNYX_API_KEY:-}"
      TELNYX_CONNECTION_ID: "${TELNYX_CONNECTION_ID:-}"
      TELNYX_WEBHOOK_PUBLIC_KEY: "${TELNYX_WEBHOOK_PUBLIC_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      # Price ids are public identifiers, not secrets — they appear in any
      # client-side Stripe integration — so they carry real defaults. Without
      # them a plan is not offered for purchase at all, and this file passed
      # neither, so the pricing page could only ever say "Talk to us".
      STRIPE_PRICE_STARTER: "${STRIPE_PRICE_STARTER:-price_1U5Jm8L127qQV0Os9cRk0OqF}"
      STRIPE_PRICE_PRO: "${STRIPE_PRICE_PRO:-price_1U5JmBL127qQV0OsmJMGgDbl}"
      MAX_OWNED_WORKSPACES: "${MAX_OWNED_WORKSPACES:-50}"
    depends_on:
      harkbell-api:
        condition: service_healthy
    networks:
      - app-network

  vocalonix-web:
    build:
      context: ../../..
      dockerfile: app/web/Dockerfile
      args:
        VITE_API_BASE_URL: "${API_PUBLIC_URL}"
    restart: unless-stopped
    depends_on:
      harkbell-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

volumes:
  vocalonix_postgres_data:
  caddy-data:
  caddy-config:

networks:
  app-network:
