server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite content-hashes these, so the filename changes whenever the bytes do.
  # Caching them forever is safe and necessary — the entry bundle is ~420 KB and
  # would otherwise be refetched on every navigation.
  #
  # `=404` rather than falling through to the SPA handler below, and that part
  # is not an optimisation. With the catch-all fallback, a request for an asset
  # that no longer exists returned index.html with `200 text/html`. A browser
  # asking for a JavaScript module got HTML, failed to parse it, and rendered
  # nothing — with no 404 anywhere to show for it. That is the whole failure:
  # blank page, clean network tab.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Everything else revalidates. index.html names the hashed assets above, so a
  # stale copy points at files that were deleted by the next deploy — which is
  # precisely how a browser that had visited before ended up on a blank page
  # while a fresh one loaded fine. Nothing here set Cache-Control at all, so
  # browsers applied their own heuristic and cached it for hours.
  #
  # `no-cache` means revalidate, not "do not store": unchanged files still come
  # back as a 304, so the cost is one conditional request, not a re-download.
  # It also covers /embed/, whose widget URL is pasted into customer sites and
  # must be able to ship a fix without every host page pinning the old copy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
