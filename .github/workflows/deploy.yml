name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hetzner
    env:
      # Two values, because one name can no longer do both jobs. harkbell.com
      # resolves to Cloudflare, not to the box, so it cannot be an SSH target;
      # the box's own address cannot serve the health checks, because the origin
      # certificate behind the proxy is trusted by Cloudflare alone and Caddy
      # has no site block matching a bare IP. SSH goes direct, HTTP goes public.
      HOST: ${{ secrets.HETZNER_HOST }}
      PUBLIC_ORIGIN: ${{ secrets.HETZNER_PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check deploy secrets
        run: |
          : "${HOST:?HETZNER_HOST is not set on the hetzner environment}"
          : "${PUBLIC_ORIGIN:?HETZNER_PUBLIC_ORIGIN is not set on the hetzner environment}"
          case "$PUBLIC_ORIGIN" in
            https://*) ;;
            *) echo "HETZNER_PUBLIC_ORIGIN must include the scheme, e.g. https://harkbell.com" >&2; exit 1 ;;
          esac
          # An IP literal sends no SNI, so Caddy matches no site block and kills
          # the handshake with "tlsv1 alert internal error" — identical on every
          # attempt, so the retry loop below burns its full five minutes and
          # reports a timeout for what is really a misconfigured secret.
          case "${PUBLIC_ORIGIN#https://}" in
            *[!0-9.]*) ;;
            *) echo "HETZNER_PUBLIC_ORIGIN must be a hostname, not an IP: TLS needs SNI to match a site." >&2; exit 1 ;;
          esac

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host hetzner\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$HOST" >> ~/.ssh/config

      # The server's .env is the deployment's real configuration, and hand-editing
      # it on the box is how it silently diverged from every other copy: the
      # checked-out mirror said one thing, the running box another, and a
      # diagnosis built on the wrong one cost hours. Infisical holds it now and
      # the deploy installs it, so there is one place to change it and no drift.
      #
      # The deploy pulls the whole folder rather than named keys, so adding a
      # secret in Infisical is the entire change — no workflow edit, no compose
      # edit. That matters: STRIPE_PRICE_STARTER once existed in the environment
      # and never reached the container because the compose file did not forward
      # it, and nothing failed loudly.
      #
      # The rsync exclude below still stands. It guards the opposite direction —
      # an operator's laptop .env must never reach the box — and that is exactly
      # why this step writes from Infisical rather than from the checkout.
      - name: Install server configuration
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp)"
          infisical_err="$(mktemp)"
          trap 'rm -f "$env_file" "$infisical_err"' EXIT

          : "${INFISICAL_CLIENT_ID:?INFISICAL_CLIENT_ID is not set on the hetzner environment}"
          : "${INFISICAL_CLIENT_SECRET:?INFISICAL_CLIENT_SECRET is not set on the hetzner environment}"
          : "${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID is not set on the hetzner environment}"

          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update -qq && sudo apt-get install -y infisical

          # `--plain --silent` so only the token reaches stdout; anything else
          # would be captured into the variable and sent to the server.
          token="$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent 2>"$infisical_err")"

          infisical export \
            --token="$token" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env=prod --path=/be --format=dotenv --silent \
            > "$env_file" 2>"$infisical_err"

          # `export --format=dotenv` wraps every value in single quotes, and
          # docker's --env-file keeps them LITERAL: NODE_ENV='production'
          # reaches the app as "'production'" and fails env.ts validation.
          # Stripping one layer round-trips byte-identical to the stored
          # values, including ones containing spaces. This runs FIRST: the
          # placeholder filter below matches a bare REPLACE_ME, and in the
          # other order it sees REPLACE_ME still in quotes, matches nothing,
          # and installs the placeholder as a real value.
          sed -i -E "s/^([A-Za-z_][A-Za-z0-9_]*)='(.*)'$/\\1=\\2/" "$env_file"

          # A key with no value yet is stored as the REPLACE_ME placeholder so
          # it is visible in the Infisical UI. It must never reach the box:
          # env.ts reads any non-empty string as a real value, so
          # STRIPE_SECRET_KEY=REPLACE_ME would switch billing on and 502 at
          # checkout. Dropping it installs the key as absent instead.
          pending="$(grep -E '^[A-Za-z_][A-Za-z0-9_]*=REPLACE_ME$' "$env_file" | cut -d= -f1 | tr '\n' ' ' || true)"
          if [ -n "$pending" ]; then
            echo "::notice::Still unset in Infisical, installed as absent: $pending"
            sed -i -E '/^[A-Za-z_][A-Za-z0-9_]*=REPLACE_ME$/d' "$env_file"
          fi

          # A truncated or half-populated environment would overwrite a working
          # configuration with one that cannot boot, and the deploy would report
          # it as a health-check timeout several minutes later.
          #
          # The list is read out of the compose file rather than written here,
          # because a hand-kept copy is the thing that drifts: this check used to
          # name four keys while the compose file interpolated thirteen with no
          # default, so nine could go missing, reach the container as the empty
          # string, and fail env.ts validation at boot with nothing pointing at
          # the cause. `${VAR}` (no `:-`) is exactly the set with no fallback.
          compose="deploy/hetzner/vocalonix/docker-compose.yml"
          required="$(grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' "$compose" | tr -d '${}' | sort -u)"

          # Has a default, but the default is worse than a failure: absent, every
          # container agrees the database password is the literal "vocalonix"
          # and the stack comes up healthy on a public box.
          required="$required HARKBELL_POSTGRES_PASSWORD"

          missing=""
          for key in $required; do
            grep -q "^${key}=" "$env_file" || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "Infisical /be @ prod is missing:$missing" >&2
            echo "Each of these either has no default in $compose or has a dangerous one," >&2
            echo "so installing this environment would break the box quietly. Refusing." >&2
            exit 1
          fi
          echo "Installing $(grep -cE '^[A-Za-z_]' "$env_file") values from Infisical /be @ prod."

          # Truncate in place rather than replacing the file. A rename would give
          # it a fresh inode, and anything bind-mounting it would keep serving the
          # old one — the trap that made Caddyfile edits invisible for a day.
          # The remote script is an argument, not a heredoc: ssh's stdin has to
          # stay free to carry the file itself.
          ssh hetzner \
            'set -eu; f=/opt/vocalonix/repo/deploy/hetzner/vocalonix/.env; umask 077; cat > "$f"; chmod 600 "$f"' \
            < "$env_file"

          # ── Origin certificate ──────────────────────────────────────────────
          # Caddy secures the Cloudflare→origin hop with a Cloudflare Origin
          # Certificate. It used to live only at /opt/vocalonix/certs — outside
          # the repo, outside every backup — so tearing the box down destroyed
          # it and rebuilding meant a console visit and a hand-copied key. It
          # comes from Infisical now, like everything else.
          #
          # Its own folder rather than /be: /be is written wholesale to the
          # box's .env and forwarded to containers, and a TLS private key has no
          # business in an application container's environment.
          #
          # Base64 because dotenv is a one-line-per-value format and a PEM is
          # multi-line. Stored raw it would need \n escaping that has to survive
          # two shells and a sed — the same class of bug as the quoting above.
          cert_dir="$(mktemp -d)"
          trap 'rm -rf "$cert_dir"; rm -f "$env_file" "$infisical_err"' EXIT

          infisical export \
            --token="$token" \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env=prod --path=/tls --format=dotenv --silent \
            > "$cert_dir/tls.env" 2>"$infisical_err" || {
              echo "Could not read Infisical /tls @ prod; Caddy cannot start without the origin certificate." >&2
              sed -n '1,5p' "$infisical_err" || true
              exit 1
            }
          sed -i -E "s/^([A-Za-z_][A-Za-z0-9_]*)='(.*)'$/\1=\2/" "$cert_dir/tls.env"

          # REPLACE_ME is checked by name rather than left to fail later: it is
          # not valid base64, so without this the step dies inside `base64 -d`
          # with no message at all and the log shows only a bare exit 1.
          for key in ORIGIN_CERT_B64 ORIGIN_KEY_B64; do
            value="$(grep "^${key}=" "$cert_dir/tls.env" | cut -d= -f2- || true)"
            if [ -z "$value" ] || [ "$value" = "REPLACE_ME" ]; then
              echo "Infisical /tls @ prod has no value for $key. Caddy is configured" >&2
              echo "for a Cloudflare Origin Certificate and will not start without one." >&2
              exit 1
            fi
          done

          decode() {
            grep "^$1=" "$cert_dir/tls.env" | cut -d= -f2- | base64 -d > "$2" 2>/dev/null || {
              echo "$1 in /tls is not valid base64." >&2
              exit 1
            }
          }
          decode ORIGIN_CERT_B64 "$cert_dir/origin.pem"
          decode ORIGIN_KEY_B64  "$cert_dir/origin.key"
          chmod 600 "$cert_dir/origin.key"

          # A cert and key that do not belong together make Caddy fail at
          # startup with a TLS error that reads like a network fault — minutes
          # and one red herring away from the actual cause.
          cert_pub="$(openssl x509 -in "$cert_dir/origin.pem" -noout -pubkey 2>/dev/null | openssl sha256)"
          key_pub="$(openssl pkey -in "$cert_dir/origin.key" -pubout 2>/dev/null | openssl sha256)"
          if [ -z "$cert_pub" ] || [ "$cert_pub" != "$key_pub" ]; then
            echo "ORIGIN_CERT_B64 and ORIGIN_KEY_B64 in /tls are not a matching pair." >&2
            exit 1
          fi

          # Origin Certificates run to 15 years, so an expired one means nobody
          # has looked at this in a very long time. Saying so here beats serving
          # it and having Cloudflare 526 the entire site.
          if ! openssl x509 -in "$cert_dir/origin.pem" -noout -checkend 0 >/dev/null 2>&1; then
            echo "The origin certificate in /tls has expired." >&2
            exit 1
          fi
          echo "Origin certificate valid until $(openssl x509 -in "$cert_dir/origin.pem" -noout -enddate | cut -d= -f2)."

          # Installed on every deploy, never conditionally. "Only if missing" is
          # exactly what lets a box keep serving a stale certificate while
          # Infisical holds the current one — the drift this whole migration
          # exists to remove. Caddy is force-recreated below regardless, so
          # rewriting an identical file costs nothing.
          tar -C "$cert_dir" -cf - origin.pem origin.key | ssh hetzner \
            'set -eu; umask 077; mkdir -p /opt/vocalonix/certs; tar -C /opt/vocalonix/certs -xf -; chmod 644 /opt/vocalonix/certs/origin.pem; chmod 600 /opt/vocalonix/certs/origin.key'

      - name: Sync repo to server
        run: |
          rsync -az \
            --exclude .git --exclude .terraform --exclude node_modules --exclude dist \
            --exclude 'terraform/.ssh' --exclude 'terraform/*.tfstate*' \
            --exclude '.env' --exclude 'deploy/hetzner/*/.env' \
            . hetzner:/opt/vocalonix/repo

      - name: Build and restart services
        run: |
          ssh hetzner /bin/bash -s <<'EOF'
          set -eu
          cd /opt/vocalonix/repo/deploy/hetzner/vocalonix
          # The project name is pinned. It must never be derived from whatever
          # happens to own a container called "caddy" on the host: that reads a
          # foreign project name off an unrelated stack and then recreates its
          # shared containers with this stack's config. Pointing the deploy at
          # the wrong server is what makes that reachable, and adopting the
          # foreign name turns the mistake into an outage on the other service
          # instead of an error here. Pinned, a wrong-host deploy fails loudly
          # on the "caddy" container-name conflict and changes nothing.
          docker compose -p vocalonix --env-file .env up -d --build --wait
          # Caddy is recreated unconditionally because compose cannot tell that
          # it needs to be. The Caddyfile is bind-mounted as a single file, which
          # pins the mount to an inode, and rsync replaces rather than edits — so
          # after a deploy the host path is a new inode while the container still
          # serves the old one. Nothing in the container spec changed, so compose
          # leaves it running, and `caddy reload` re-reads the same stale file:
          # a Caddyfile edit deploys green and changes nothing until the
          # container is rebound. Recreating costs about a second of proxy
          # downtime, which is cheaper than a silently ignored config.
          docker compose -p vocalonix --env-file .env up -d --force-recreate --wait caddy
          EOF

      - name: Verify deployment
        run: |
          sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "$PUBLIC_ORIGIN/api/health"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Health endpoint did not become reachable over TLS" >&2
              exit 1
            fi
            echo "Waiting for TLS/health (attempt $attempt)..."
            sleep 10
          done
          curl -fsS "$PUBLIC_ORIGIN/api/health"
          curl -fsS "$PUBLIC_ORIGIN/api/dograh/health"
          bundle=$(curl -fsS "$PUBLIC_ORIGIN/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "Serving bundle: $bundle (commit $sha)"
