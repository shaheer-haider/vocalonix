name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hetzner
    env:
      HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host hetzner\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$HOST" >> ~/.ssh/config

      - name: Sync repo to server
        run: |
          rsync -az \
            --exclude .git --exclude .terraform --exclude node_modules --exclude dist \
            --exclude 'terraform/.ssh' --exclude 'terraform/*.tfstate*' \
            --exclude '.env' --exclude 'deploy/hetzner/*/.env' \
            . hetzner:/opt/vocalonix/repo

      - name: Build and restart services
        run: |
          ssh hetzner /bin/bash -s <<'EOF'
          set -eu
          cd /opt/vocalonix/repo/deploy/hetzner/vocalonix
          # The stack may already be running under a different compose project
          # name (e.g. from a manual deploy). Reuse it so existing containers
          # and volumes (including the postgres data volume) are adopted
          # instead of colliding on the fixed "caddy" container name.
          project=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' caddy 2>/dev/null || true)
          if [ -z "$project" ]; then
            # caddy is absent or unmanaged; remove any unmanaged leftover.
            docker rm -f caddy 2>/dev/null || true
            project=vocalonix
          fi
          echo "Using compose project: $project"
          docker compose -p "$project" --env-file .env up -d --build --wait
          EOF

      - name: Verify deployment
        run: |
          sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://$HOST/api/health"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Health endpoint did not become reachable over TLS" >&2
              exit 1
            fi
            echo "Waiting for TLS/health (attempt $attempt)..."
            sleep 10
          done
          curl -fsS "https://$HOST/api/health"
          curl -fsS "https://$HOST/api/dograh/health"
          bundle=$(curl -fsS "https://$HOST/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "Serving bundle: $bundle (commit $sha)"
