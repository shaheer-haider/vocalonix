name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hetzner
    env:
      # Two values, because one name can no longer do both jobs. harkbell.com
      # resolves to Cloudflare, not to the box, so it cannot be an SSH target;
      # the box's own address cannot serve the health checks, because the origin
      # certificate behind the proxy is trusted by Cloudflare alone and Caddy
      # has no site block matching a bare IP. SSH goes direct, HTTP goes public.
      HOST: ${{ secrets.HETZNER_HOST }}
      PUBLIC_ORIGIN: ${{ secrets.HETZNER_PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check deploy secrets
        run: |
          : "${HOST:?HETZNER_HOST is not set on the hetzner environment}"
          : "${PUBLIC_ORIGIN:?HETZNER_PUBLIC_ORIGIN is not set on the hetzner environment}"
          case "$PUBLIC_ORIGIN" in
            https://*) ;;
            *) echo "HETZNER_PUBLIC_ORIGIN must include the scheme, e.g. https://harkbell.com" >&2; exit 1 ;;
          esac
          # An IP literal sends no SNI, so Caddy matches no site block and kills
          # the handshake with "tlsv1 alert internal error" — identical on every
          # attempt, so the retry loop below burns its full five minutes and
          # reports a timeout for what is really a misconfigured secret.
          case "${PUBLIC_ORIGIN#https://}" in
            *[!0-9.]*) ;;
            *) echo "HETZNER_PUBLIC_ORIGIN must be a hostname, not an IP: TLS needs SNI to match a site." >&2; exit 1 ;;
          esac

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host hetzner\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$HOST" >> ~/.ssh/config

      - name: Sync repo to server
        run: |
          rsync -az \
            --exclude .git --exclude .terraform --exclude node_modules --exclude dist \
            --exclude 'terraform/.ssh' --exclude 'terraform/*.tfstate*' \
            --exclude '.env' --exclude 'deploy/hetzner/*/.env' \
            . hetzner:/opt/vocalonix/repo

      - name: Build and restart services
        run: |
          ssh hetzner /bin/bash -s <<'EOF'
          set -eu
          cd /opt/vocalonix/repo/deploy/hetzner/vocalonix
          # The project name is pinned. It must never be derived from whatever
          # happens to own a container called "caddy" on the host: that reads a
          # foreign project name off an unrelated stack and then recreates its
          # shared containers with this stack's config. Pointing the deploy at
          # the wrong server is what makes that reachable, and adopting the
          # foreign name turns the mistake into an outage on the other service
          # instead of an error here. Pinned, a wrong-host deploy fails loudly
          # on the "caddy" container-name conflict and changes nothing.
          docker compose -p vocalonix --env-file .env up -d --build --wait
          EOF

      - name: Verify deployment
        run: |
          sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "$PUBLIC_ORIGIN/api/health"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Health endpoint did not become reachable over TLS" >&2
              exit 1
            fi
            echo "Waiting for TLS/health (attempt $attempt)..."
            sleep 10
          done
          curl -fsS "$PUBLIC_ORIGIN/api/health"
          curl -fsS "$PUBLIC_ORIGIN/api/dograh/health"
          bundle=$(curl -fsS "$PUBLIC_ORIGIN/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "Serving bundle: $bundle (commit $sha)"
